<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Los Simpsons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="simpsons-header py-4 text-center">
    <h1 class="simpsons-title mb-0">Los Simpsons</h1>
    <p class="simpsons-subtitle mb-0">Explorador de Personajes</p>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center mb-4">
      <div class="col-12 col-md-7">
        <div class="input-group">
          <input
            type="text"
            id="searchInput"
            class="form-control form-control-lg"
            placeholder="Buscar personaje por nombre..."
          />
          <button id="searchBtn" class="btn btn-warning fw-bold px-4">Buscar</button>
          <button id="clearBtn" class="btn btn-secondary px-3">Limpiar</button>
        </div>
      </div>
    </div>

    <div id="noResults" class="alert alert-warning text-center d-none" role="alert">
      No se encontraron personajes con ese nombre.
    </div>

    <div id="errorMessage" class="alert alert-danger text-center d-none" role="alert"></div>

    <div id="cardsContainer" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
